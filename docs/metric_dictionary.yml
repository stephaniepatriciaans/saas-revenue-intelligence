version: 1

reporting:
  calendar: calendar_month
  snapshot: month_end
  currency: source_monetary_units
  status: proposed_pending_data_validation

metrics:
  mrr:
    grain: customer_month
    aggregation: sum
    definition: >
      Monthly-normalized recurring subscription value
      for active paid customer entitlements.
    exclusions:
      - free_entitlements
      - nonrecurring_payments
      - inactive_entitlements
    normalization:
      day_based: amount_paid * 365.25 / (12 * days)
      calendar_month: monthly_plan_price
    limitations:
      - discount_terms_may_be_ambiguous
      - overlapping_transactions_require_resolution

  arr:
    grain: reporting_month
    formula: mrr * 12
    definition: annualized_recurring_revenue_run_rate

  nrr:
    grain: reporting_month
    formula: >
      (starting_mrr + expansion_mrr
       - contraction_mrr - churned_mrr)
      / starting_mrr
    population: previous_month_end_paid_customers
    exclude_new_customers: true
    zero_denominator: null

  customer_churn:
    grain: reporting_month
    formula: churned_customers / starting_customers
    population: previous_month_end_paid_customers
    zero_denominator: null

  gross_revenue_churn:
    grain: reporting_month
    formula: >
      (churned_mrr + contraction_mrr) / starting_mrr
    zero_denominator: null

  cohort_retention:
    grain: acquisition_cohort_month_and_age
    formula: active_cohort_customers / cohort_size
    cohort_basis: first_observed_paid_month

  assumed_gross_margin:
    grain: reporting_month_and_scenario
    formula: >
      (revenue - assumed_cogs) / revenue
    zero_denominator: null
    observed_costs: false
    scenario_only: true
