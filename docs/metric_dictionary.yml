version: 1

project:
  name: SaaS Revenue Intelligence Platform
  dataset: KKBox WSDM 2018
  metric_status: proposed_pending_validation

reporting:
  period: calendar_month
  snapshot: month_end
  currency: source_monetary_units

metrics:
  mrr:
    name: Monthly Recurring Revenue
    definition: >
      Monthly-normalized recurring subscription value
      for active paid customers at month-end.
    grain: customer_month
    source: transactions
    exclusions:
      - free_subscriptions
      - inactive_subscriptions
      - nonrecurring_transactions
    calculation:
      day_based: amount_paid * 365.25 / (12 * plan_days)
      calendar_month: monthly_recurring_price

  arr:
    name: Annual Recurring Revenue
    definition: Annualized MRR run-rate.
    grain: reporting_month
    formula: mrr * 12

  nrr:
    name: Net Revenue Retention
    definition: >
      Recurring revenue retained from the opening
      customer cohort, including expansion and
      contraction but excluding new customers.
    grain: reporting_month
    formula: >
      (starting_mrr + expansion_mrr
       - contraction_mrr - churned_mrr)
      / starting_mrr
    zero_denominator: null

  customer_churn:
    name: Customer Churn Rate
    definition: >
      Percentage of opening paid customers
      without an active paid subscription
      at the reporting month-end.
    grain: reporting_month
    formula: churned_customers / starting_customers
    zero_denominator: null

  gross_revenue_churn:
    name: Gross Revenue Churn
    definition: >
      Percentage of opening recurring revenue
      lost through churn and contraction.
    grain: reporting_month
    formula: >
      (churned_mrr + contraction_mrr) / starting_mrr
    zero_denominator: null

  cohort_retention:
    name: Cohort Retention
    definition: >
      Percentage of customers from a first-observed
      paid subscription cohort still active
      after a given number of months.
    grain: cohort_month_and_age
    formula: active_cohort_customers / cohort_size

  assumed_gross_margin:
    name: Scenario Gross Margin
    definition: >
      Gross margin calculated using explicitly
      assumed costs rather than observed costs.
    grain: reporting_month_and_scenario
    formula: >
      (revenue - assumed_cogs) / revenue
    observed_costs: false
    zero_denominator: null
